name: "Build & Push Dependency Container"

on:
  workflow_call:
    inputs:
      project:
        description: "The name of the project"
        required: true
        type: string
      version:
        description: "The version tag to build"
        required: true
        type: string
      upstream_tag:
        description: "Optional upstream tag if different from version"
        required: false
        type: string
        default: ""
      is_latest:
        description: "Whether to tag this build as latest"
        required: true
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image metadata
        id: meta
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_OWNER_LOWER/${{ inputs.project }}"
          TAGS="$IMAGE_NAME:${{ inputs.version }}"
          if [[ "${{ inputs.is_latest }}" == "true" ]]; then
            TAGS="$TAGS,$IMAGE_NAME:latest"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "TAG_PRIMARY=$IMAGE_NAME:${{ inputs.version }}" >> $GITHUB_ENV
          echo "BUILD_TAGS=$TAGS" >> $GITHUB_ENV

      - name: Check if remote tag exists
        id: check_tag
        continue-on-error: true
        run: |
          if docker manifest inspect ${{ env.TAG_PRIMARY }} > /dev/null 2>&1; then
            echo "Tag ${{ env.TAG_PRIMARY }} already exists. Skipping build."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag ${{ env.TAG_PRIMARY }} does not exist. Proceeding to build."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push multi-platform image
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./containers/deps/${{ inputs.project }}
          file: ./containers/deps/${{ inputs.project }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BUILD_TAGS }}
          build-args: |
            UPSTREAM_VERSION=${{ inputs.upstream_tag || inputs.version }}
            HADOOP_VERSION=${{ inputs.upstream_tag || inputs.version }}
            HIVE_VERSION=${{ inputs.upstream_tag || inputs.version }}
            SPARK_VERSION=${{ inputs.upstream_tag || inputs.version }}
            STORM_VERSION=${{ inputs.upstream_tag || inputs.version }}
            ZOOKEEPER_VERSION=${{ inputs.upstream_tag || inputs.version }}
          cache-from: type=gha,scope=${{ inputs.project }}-${{ inputs.version }}
          cache-to: type=gha,mode=max,scope=${{ inputs.project }}-${{ inputs.version }}
