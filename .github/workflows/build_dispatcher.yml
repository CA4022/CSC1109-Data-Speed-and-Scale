name: Build Dispatcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "containers/**"

jobs:
  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      base-root-config-bat: ${{ steps.filter.outputs.base-root-config-bat }}
      base-root-config-glamour: ${{ steps.filter.outputs.base-root-config-glamour }}
      base-root-config-fresh: ${{ steps.filter.outputs.base-root-config-fresh }}
      base-root-config-micro: ${{ steps.filter.outputs.base-root-config-micro }}
      base-root-config-emacs: ${{ steps.filter.outputs.base-root-config-emacs }}
      base-root-config-nvim: ${{ steps.filter.outputs.base-root-config-nvim }}
      base-root-changed: ${{ steps.consolidate.outputs.base-root-changed }}
      base-changed: ${{ steps.consolidate.outputs.base-changed }}
      dind-changed: ${{ steps.consolidate.outputs.dind-changed }}
      dind-minimal-changed: ${{ steps.consolidate.outputs.dind-minimal-changed }}
      lab1-client-changed: ${{ steps.consolidate.outputs.lab1-client-changed }}
      lab1-changed: ${{ steps.consolidate.outputs.lab1-changed }}
      lab2-client-changed: ${{ steps.consolidate.outputs.lab2-client-changed }}
      lab2-changed: ${{ steps.consolidate.outputs.lab2-changed }}
      lab3-client-changed: ${{ steps.consolidate.outputs.lab3-client-changed }}
      lab3-changed: ${{ steps.consolidate.outputs.lab3-changed }}
      lab4-client-changed: ${{ steps.consolidate.outputs.lab4-client-changed }}
      lab4-changed: ${{ steps.consolidate.outputs.lab4-changed }}
      lab5-client-changed: ${{ steps.consolidate.outputs.lab5-client-changed }}
      lab5-changed: ${{ steps.consolidate.outputs.lab5-changed }}
      lab6-client-changed: ${{ steps.consolidate.outputs.lab6-client-changed }}
      lab6-changed: ${{ steps.consolidate.outputs.lab6-changed }}
      bonus3-changed: ${{ steps.consolidate.outputs.bonus3-changed }}
      dep-hadoop-changed: ${{ steps.consolidate.outputs.dep-hadoop-changed }}
      dep-hive-changed: ${{ steps.consolidate.outputs.dep-hive-changed }}
      dep-spark-changed: ${{ steps.consolidate.outputs.dep-spark-changed }}
      dep-storm-changed: ${{ steps.consolidate.outputs.dep-storm-changed }}
      dep-zookeeper-changed: ${{ steps.consolidate.outputs.dep-zookeeper-changed }}
      sandbox-client-noroot-apache: ${{ steps.consolidate.outputs.sandbox-client-noroot-apache }}
      sandbox-client-noroot-jupyter: ${{ steps.filter.outputs.sandbox-client-noroot-jupyter }}
      sandbox-client-noroot-changed: ${{ steps.consolidate.outputs.sandbox-client-noroot-changed }}
      sandbox-client-changed: ${{ steps.consolidate.outputs.sandbox-client-changed }}
      sandbox-changed: ${{ steps.consolidate.outputs.sandbox-changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use paths-filter action
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base-root-config-bat:
              - 'containers/base/root/.config/bat/**'
            base-root-config-glamour:
              - 'containers/base/root/.config/glamour/**'
            base-root-config-fresh:
              - 'containers/base/root/.config/fresh/**'
            base-root-config-micro:
              - 'containers/base/root/.config/micro/**'
            base-root-config-emacs:
              - 'containers/base/root/.config/emacs/**'
            base-root-config-nvim:
              - 'containers/base/root/.config/nvim/**'
            base-root:
              - 'containers/base/root/**'
            base:
              - 'containers/base/**'
            dind:
              - 'containers/dind/**'
            dind-minimal:
              - 'containers/dind-minimal/**'
            lab1-client:
              - 'containers/lab1/client/**'
            lab1:
              - 'containers/lab1/**'
            lab2-client:
              - 'containers/lab2/client/**'
            lab2:
              - 'containers/lab2/**'
            lab3-client:
              - 'containers/lab3/client/**'
            lab3:
              - 'containers/lab3/**'
            lab4-client:
              - 'containers/lab4/client/**'
            lab4:
              - 'containers/lab4/**'
            lab5-client:
              - 'containers/lab5/client/**'
            lab5:
              - 'containers/lab5/**'
            lab6-client:
              - 'containers/lab6/client/**'
            lab6:
              - 'containers/lab6/**'
            bonus3:
              - 'containers/bonus3/**'
            sandbox-client-noroot-apache:
              - 'containers/sandbox/client/noroot/apache/**'
            sandbox-client-noroot-jupyter:
              - 'containers/sandbox/client/noroot/jupyter/**'
            sandbox-client-noroot:
              - 'containers/sandbox/client/noroot/**'
            sandbox-client:
              - 'containers/sandbox/client/**'
            sandbox:
              - 'containers/sandbox/**'
            dep-hadoop:
              - 'containers/deps/hadoop/**'
            dep-hive:
              - 'containers/deps/hive/**'
            dep-spark:
              - 'containers/deps/spark/**'
            dep-storm:
              - 'containers/deps/storm/**'
            dep-zookeeper:
              - 'containers/deps/zookeeper/**'

      - name: Consolidate change logic
        id: consolidate
        shell: python
        run: |
          import os

          github_output = {}
          str_to_bool = {"true": True, "false": False}.get
          bool_to_str = {True: "true", False: "false"}.get

          # Dependency image logic
          dep_hadoop_changed = str_to_bool("${{ steps.filter.outputs.dep-hadoop }}")
          dep_hive_changed = str_to_bool("${{ steps.filter.outputs.dep-hive }}")
          dep_spark_changed = str_to_bool("${{ steps.filter.outputs.dep-spark }}")
          dep_storm_changed = str_to_bool("${{ steps.filter.outputs.dep-storm }}")
          dep_zookeeper_changed = str_to_bool("${{ steps.filter.outputs.dep-zookeeper }}")

          github_output["dep-hadoop-changed"] = dep_hadoop_changed
          github_output["dep-hive-changed"] = dep_hive_changed
          github_output["dep-spark-changed"] = dep_spark_changed
          github_output["dep-storm-changed"] = dep_storm_changed
          github_output["dep-zookeeper-changed"] = dep_zookeeper_changed

          # Consolidate base image logic
          base_config_outputs = list(map(str_to_bool, (
            "${{ steps.filter.outputs.base-root-config-bat }}",
            "${{ steps.filter.outputs.base-root-config-glamour }}",
            "${{ steps.filter.outputs.base-root-config-fresh }}",
            "${{ steps.filter.outputs.base-root-config-micro }}",
            "${{ steps.filter.outputs.base-root-config-emacs }}",
            "${{ steps.filter.outputs.base-root-config-nvim }}",
          )))
          base_root_output = str_to_bool("${{ steps.filter.outputs.base-root }}")
          base_root_changed = any([*base_config_outputs, base_root_output])
          github_output["base-root-changed"] = base_root_changed

          base_changed = str_to_bool("${{ steps.filter.outputs.base }}") or base_root_changed
          github_output["base-changed"] = base_changed

          dind_changed = str_to_bool("${{ steps.filter.outputs.dind }}") or base_changed
          github_output["dind-changed"] = dind_changed

          dind_minimal_changed = str_to_bool("${{ steps.filter.outputs.dind-minimal }}")
          github_output["dind-minimal-changed"] = dind_minimal_changed

          # Consolidate sandbox image logic similar to above
          sandbox_client_noroot_apache = str_to_bool("${{ steps.filter.outputs.sandbox-client-noroot-apache }}") or dep_hadoop_changed
          github_output["sandbox-client-noroot-apache"] = sandbox_client_noroot_apache

          sandbox_component_outputs = [
            sandbox_client_noroot_apache,
            str_to_bool("${{ steps.filter.outputs.sandbox-client-noroot-jupyter }}"),
          ]
          sandbox_client_noroot_output = str_to_bool("${{ steps.filter.outputs.sandbox-client-noroot }}")
          sandbox_client_noroot_changed = any([*sandbox_component_outputs, sandbox_client_noroot_output])
          github_output["sandbox-client-noroot-changed"] = sandbox_client_noroot_changed
          sandbox_client_output = str_to_bool("${{ steps.filter.outputs.sandbox-client }}")
          sandbox_client_changed = sandbox_client_noroot_changed or sandbox_client_output
          github_output["sandbox-client-changed"] = sandbox_client_changed

          sandbox_changed = str_to_bool("${{ steps.filter.outputs.sandbox }}") or dind_minimal_changed or dep_hadoop_changed or dep_hive_changed or dep_spark_changed
          github_output["sandbox-changed"] = sandbox_changed

          # Consolidate lab change logic
          lab_changes = {
            k: v for k, v in
            {
              "lab1-client-changed": str_to_bool("${{ steps.filter.outputs.lab1-client }}") or base_changed or dep_hadoop_changed,
              "lab1-changed": str_to_bool("${{ steps.filter.outputs.lab1 }}") or dind_changed or dep_hadoop_changed,
              "lab2-client-changed": str_to_bool("${{ steps.filter.outputs.lab2-client }}") or base_changed or dep_hadoop_changed,
              "lab2-changed": str_to_bool("${{ steps.filter.outputs.lab2 }}") or dind_changed or dep_hadoop_changed or dep_hive_changed,
              "lab3-client-changed": str_to_bool("${{ steps.filter.outputs.lab3-client }}") or base_changed or dep_hadoop_changed,
              "lab3-changed": str_to_bool("${{ steps.filter.outputs.lab3 }}") or dind_changed or dep_hadoop_changed,
              "lab4-client-changed": str_to_bool("${{ steps.filter.outputs.lab4-client }}") or base_changed,
              "lab4-changed": str_to_bool("${{ steps.filter.outputs.lab4 }}") or dind_changed or dep_storm_changed or dep_zookeeper_changed,
              "lab5-client-changed": str_to_bool("${{ steps.filter.outputs.lab5-client }}") or base_changed or dep_hadoop_changed or dep_spark_changed,
              "lab5-changed": str_to_bool("${{ steps.filter.outputs.lab5 }}") or dind_changed or dep_hadoop_changed or dep_spark_changed,
              "lab6-client-changed": str_to_bool("${{ steps.filter.outputs.lab6-client }}") or sandbox_client_changed,
              "lab6-changed": str_to_bool("${{ steps.filter.outputs.lab6 }}") or sandbox_changed,
              "bonus3-changed": str_to_bool("${{ steps.filter.outputs.bonus3 }}") or base_changed,
            }.items()
          }
          github_output.update(lab_changes)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output_file:
              for k, v in github_output.items():
                  output_file.write(f"{k}={bool_to_str(v)}\n")

  build-dep-hadoop:
    needs: determine-changes
    if: >-
      always() &&
      (needs.determine-changes.outputs.dep-hadoop-changed == 'true' || github.event_name == 'workflow_dispatch')
    name: "Build Hadoop dependency"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dep_build_hadoop.yml
    secrets: inherit

  build-dep-hive:
    needs: determine-changes
    if: >-
      always() &&
      (needs.determine-changes.outputs.dep-hive-changed == 'true' || github.event_name == 'workflow_dispatch')
    name: "Build Hive dependency"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dep_build_hive.yml
    secrets: inherit

  build-dep-spark:
    needs: determine-changes
    if: >-
      always() &&
      (needs.determine-changes.outputs.dep-spark-changed == 'true' || github.event_name == 'workflow_dispatch')
    name: "Build Spark dependency"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dep_build_spark.yml
    secrets: inherit

  build-dep-storm:
    needs: determine-changes
    if: >-
      always() &&
      (needs.determine-changes.outputs.dep-storm-changed == 'true' || github.event_name == 'workflow_dispatch')
    name: "Build Storm dependency"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dep_build_storm.yml
    secrets: inherit

  build-dep-zookeeper:
    needs: determine-changes
    if: >-
      always() &&
      (needs.determine-changes.outputs.dep-zookeeper-changed == 'true' || github.event_name == 'workflow_dispatch')
    name: "Build Zookeeper dependency"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dep_build_zookeeper.yml
    secrets: inherit

  build-base-root-config-bat:
    needs: determine-changes
    if: needs.determine-changes.outputs.base-root-config-bat == 'true'
    name: "Build base-root-config-bat container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/base/root/.config/bat
    secrets: inherit

  build-base-root-config-glamour:
    needs: determine-changes
    if: needs.determine-changes.outputs.base-root-config-glamour == 'true'
    name: "Build base-root-config-glamour container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/base/root/.config/glamour
    secrets: inherit

  build-base-root-config-fresh:
    needs: determine-changes
    if: needs.determine-changes.outputs.base-root-config-fresh == 'true'
    name: "Build base-root-config-fresh container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/base/root/.config/fresh
    secrets: inherit

  build-base-root-config-micro:
    needs: determine-changes
    if: needs.determine-changes.outputs.base-root-config-micro == 'true'
    name: "Build base-root-config-micro container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/base/root/.config/micro
    secrets: inherit

  build-base-root-config-emacs:
    needs: determine-changes
    if: needs.determine-changes.outputs.base-root-config-emacs == 'true'
    name: "Build base-root-config-emacs container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/base/root/.config/emacs
    secrets: inherit

  build-base-root-config-nvim:
    needs: determine-changes
    if: needs.determine-changes.outputs.base-root-config-nvim == 'true'
    name: "Build base-root-config-nvim container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/base/root/.config/nvim
    secrets: inherit

  base-root-config:
    runs-on: ubuntu-latest
    needs:
      - determine-changes
      - build-base-root-config-bat
      - build-base-root-config-glamour
      - build-base-root-config-fresh
      - build-base-root-config-micro
      - build-base-root-config-emacs
      - build-base-root-config-nvim
    if: always()
    outputs:
      build-base-root: ${{ steps.consolidate-base-root-config.outputs.build-base-root }}
    steps:
      - name: Consolidate Root Config Build Statuses
        id: consolidate-base-root-config
        shell: python
        run: |
          import os

          github_output = {}
          str_to_bool = {"true": True, "false": False}.get
          bool_to_str = {True: "true", False: "false"}.get
          status_to_bool = ("success", "skipped").__contains__

          conditions = [
              str_to_bool("${{ needs.determine-changes.outputs.base-root-changed }}"), # base_root_changed
              status_to_bool("${{ needs.build-base-root-config-bat.result }}"), # config_bat_result
              status_to_bool("${{ needs.build-base-root-config-glamour.result }}"), # config_glamour_result
              status_to_bool("${{ needs.build-base-root-config-fresh.result }}"), # config_fresh_result
              status_to_bool("${{ needs.build-base-root-config-micro.result }}"), # config_micro_result
              status_to_bool("${{ needs.build-base-root-config-emacs.result }}"), # config_emacs_result
              status_to_bool("${{ needs.build-base-root-config-nvim.result }}"), # config_nvim_result
          ]

          github_output["build-base-root"] = all(conditions)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output_file:
              for k, v in github_output.items():
                  output_file.write(f"{k}={bool_to_str(v)}\n")

  build-base-root:
    needs: base-root-config
    if: always() && needs.base-root-config.outputs.build-base-root == 'true'
    name: "Build base-root container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/base/root/
    secrets: inherit

  build-base:
    needs:
      - determine-changes
      - build-base-root
    if: >-
      always() &&
      needs.determine-changes.outputs.base-changed == 'true' &&
      needs.build-base-root.result != 'failure'
    name: "Build base container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/base/
    secrets: inherit

  build-dind:
    needs:
      - determine-changes
      - build-base
    if: >-
      always() &&
      needs.determine-changes.outputs.dind-changed == 'true' &&
      needs.build-base.result != 'failure'
    name: "Build dind container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/dind/
    secrets: inherit

  build-dind-minimal:
    needs:
      - determine-changes
    if: >-
      always() &&
      needs.determine-changes.outputs.dind-minimal-changed == 'true'
    name: "Build dind-minimal container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/dind-minimal/
    secrets: inherit

  build-lab1-client:
    needs:
      - determine-changes
      - build-base
      - build-dep-hadoop
    if: >-
      always() &&
      needs.determine-changes.outputs.lab1-client-changed == 'true' &&
      needs.build-base.result != 'failure' &&
      needs.build-dep-hadoop.result != 'failure'
    name: "Build lab1 client container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab1/client
    secrets: inherit

  build-lab1:
    needs:
      - determine-changes
      - build-dind
      - build-dep-hadoop
    if: >-
      always() &&
      needs.determine-changes.outputs.lab1-changed == 'true' &&
      needs.build-dind.result != 'failure' &&
      needs.build-dep-hadoop.result != 'failure'
    name: "Build lab1 container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab1/
    secrets: inherit

  build-lab2-client:
    needs:
      - determine-changes
      - build-base
      - build-dep-hadoop
    if: >-
      always() &&
      needs.determine-changes.outputs.lab2-client-changed == 'true' &&
      needs.build-base.result != 'failure' &&
      needs.build-dep-hadoop.result != 'failure'
    name: "Build lab2 client container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab2/client
    secrets: inherit

  build-lab2:
    needs:
      - determine-changes
      - build-dind
      - build-dep-hadoop
      - build-dep-hive
    if: >-
      always() &&
      needs.determine-changes.outputs.lab2-changed == 'true' &&
      needs.build-dind.result != 'failure' &&
      needs.build-dep-hadoop.result != 'failure' &&
      needs.build-dep-hive.result != 'failure'
    name: "Build lab2 container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab2/
    secrets: inherit

  build-lab3-client:
    needs:
      - determine-changes
      - build-base
      - build-dep-hadoop
    if: >-
      always() &&
      needs.determine-changes.outputs.lab3-client-changed == 'true' &&
      needs.build-base.result != 'failure' &&
      needs.build-dep-hadoop.result != 'failure'
    name: "Build lab3 client container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab3/client
    secrets: inherit

  build-lab3:
    needs:
      - determine-changes
      - build-dind
      - build-dep-hadoop
    if: >-
      always() &&
      needs.determine-changes.outputs.lab3-changed == 'true' &&
      needs.build-dind.result != 'failure' &&
      needs.build-dep-hadoop.result != 'failure'
    name: "Build lab3 container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab3/
    secrets: inherit

  build-lab4-client:
    needs:
      - determine-changes
      - build-base
    if: >-
      always() &&
      needs.determine-changes.outputs.lab4-client-changed == 'true' &&
      needs.build-base.result != 'failure'
    name: "Build lab4 client container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab4/client
    secrets: inherit

  build-lab4:
    needs:
      - determine-changes
      - build-dind
      - build-dep-storm
      - build-dep-zookeeper
    if: >-
      always() &&
      needs.determine-changes.outputs.lab4-changed == 'true' &&
      needs.build-dind.result != 'failure' &&
      needs.build-dep-storm.result != 'failure' &&
      needs.build-dep-zookeeper.result != 'failure'
    name: "Build lab4 container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab4/
    secrets: inherit

  build-lab5-client:
    needs:
      - determine-changes
      - build-base
      - build-dep-hadoop
      - build-dep-spark
    if: >-
      always() &&
      needs.determine-changes.outputs.lab5-client-changed == 'true' &&
      needs.build-base.result != 'failure' &&
      needs.build-dep-hadoop.result != 'failure' &&
      needs.build-dep-spark.result != 'failure'
    name: "Build lab5 client container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab5/client
    secrets: inherit

  build-lab5:
    needs:
      - determine-changes
      - build-dind
      - build-dep-hadoop
      - build-dep-spark
    if: >-
      always() &&
      needs.determine-changes.outputs.lab5-changed == 'true' &&
      needs.build-dind.result != 'failure' &&
      needs.build-dep-hadoop.result != 'failure' &&
      needs.build-dep-spark.result != 'failure'
    name: "Build lab5 container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab5/
    secrets: inherit

  build-lab6-client:
    needs:
      - determine-changes
      - build-sandbox-client
    if: >-
      always() &&
      needs.determine-changes.outputs.lab6-client-changed == 'true' &&
      needs.build-sandbox-client.result != 'failure'
    name: "Build lab6 client container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab6/client
    secrets: inherit

  build-lab6:
    needs:
      - determine-changes
      - build-sandbox
    if: >-
      always() &&
      needs.determine-changes.outputs.lab6-changed == 'true' &&
      needs.build-sandbox.result != 'failure'
    name: "Build lab6 container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/lab6/
    secrets: inherit

  build-bonus3:
    needs:
      - determine-changes
      - build-base
    if: >-
      always() &&
      needs.determine-changes.outputs.bonus3-changed == 'true' &&
      needs.build-base.result != 'failure'
    name: "Build bonus3 container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/bonus3
    secrets: inherit

  build-sandbox-client-noroot-apache:
    needs:
      - determine-changes
      - build-dep-hadoop
    if: >-
      always() &&
      needs.determine-changes.outputs.sandbox-client-noroot-apache == 'true' &&
      needs.build-dep-hadoop.result != 'failure'
    name: "Build sandbox-client-noroot-apache container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/sandbox/client/noroot/apache
    secrets: inherit

  build-sandbox-client-noroot-jupyter:
    needs: determine-changes
    if: needs.determine-changes.outputs.sandbox-client-noroot-jupyter == 'true'
    name: "Build sandbox-client-noroot-jupyter container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/sandbox/client/noroot/jupyter
    secrets: inherit

  build-sandbox-client-noroot:
    needs:
      - determine-changes
      - build-sandbox-client-noroot-apache
      - build-sandbox-client-noroot-jupyter
    if: >-
      always() &&
      needs.determine-changes.outputs.sandbox-client-noroot-changed == 'true' &&
      needs.build-sandbox-client-noroot-apache.result != 'failure' &&
      needs.build-sandbox-client-noroot-jupyter.result != 'failure'
    name: "Build sandbox-client-noroot container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/sandbox/client/noroot
    secrets: inherit

  build-sandbox-client:
    needs:
      - determine-changes
      - build-sandbox-client-noroot
      - build-base-root
    if: >-
      always() &&
      needs.determine-changes.outputs.sandbox-client-changed == 'true' &&
      needs.build-sandbox-client-noroot.result != 'failure' &&
      needs.build-base-root.result != 'failure'
    name: "Build sandbox client container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/sandbox/client
    secrets: inherit

  build-sandbox:
    needs:
      - determine-changes
      - build-dind-minimal
      - build-dep-hadoop
      - build-dep-hive
      - build-dep-spark
    if: >-
      always() &&
      needs.determine-changes.outputs.sandbox-changed == 'true' &&
      needs.build-dind-minimal.result != 'failure' &&
      needs.build-dep-hadoop.result != 'failure' &&
      needs.build-dep-hive.result != 'failure' &&
      needs.build-dep-spark.result != 'failure'
    name: "Build sandbox container"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      path: containers/sandbox
    secrets: inherit
