name: Build Hive Dependency

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild even if remote tag already exists"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      force_rebuild:
        description: "Force rebuild even if remote tag already exists"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/dep_build_hive.yml"
      - "containers/deps/hive/Dockerfile"
permissions:
  contents: read
  packages: write

jobs:
  call-template:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: "3.1.3"
            is_latest: false
          - version: "4.1.0"
            is_latest: false
          - version: "4.2.1"
            is_latest: true

    uses: ./.github/workflows/_dep_build.yml
    with:
      project: "hive"
      version: ${{ matrix.version }}
      is_latest: ${{ matrix.is_latest }}
      force_rebuild: ${{ inputs.force_rebuild || github.event_name == 'push' }}
