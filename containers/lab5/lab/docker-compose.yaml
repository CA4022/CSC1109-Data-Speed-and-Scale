version: "3.8"

x-hadoop-common-config: &hadoop-common-config
  image: ${HADOOP_RUNNER_IMAGE}:${HADOOP_RUNNER_VERSION}
  volumes:
    - .:/lab/
    - ./config/:${HADOOP_HOME}/etc/hadoop
    - jvm-shared-cache:/var/cache/javasharedresources
  environment:
    - HADOOP_HOME=${HADOOP_HOME}
    - HADOOP_USER_NAME=${HADOOP_USER_NAME}
    - HADOOP_OPTS=--add-opens=java.base/java.lang=ALL-UNNAMED

x-spark-common-config: &spark-common-config
  image: ${SPARK_IMAGE}:${SPARK_VERSION}
  volumes:
    - /lab/:/opt/spark/work-dir/
    - ./config/:${HADOOP_HOME}/etc/hadoop
    - jvm-shared-cache:/var/cache/javasharedresources

services:
  namenode:
    <<: *hadoop-common-config
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - 9870:9870
    environment:
      - HADOOP_HOME=${HADOOP_HOME}
      - HADOOP_USER_NAME=${HADOOP_USER_NAME}
      - ENSURE_NAMENODE_DIR=/tmp/hadoop-hadoop/dfs/name
      - ENSURE_NAMENODE_CLUSTERID=CID-csc1109-hadoop
      - HADOOP_OPTS=--add-opens=java.base/java.lang=ALL-UNNAMED
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  datanode:
    <<: *hadoop-common-config
    command: ["hdfs", "datanode"]
    deploy:
      mode: replicated
      replicas: 4
    depends_on:
      namenode:
        condition: service_healthy

  spark-master:
    <<: *spark-common-config
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - HADOOP_USER_NAME=${HADOOP_USER_NAME}
      - HADOOP_OPTS=--add-opens=java.base/java.lang=ALL-UNNAMED
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker:
    <<: *spark-common-config
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - HADOOP_USER_NAME=${HADOOP_USER_NAME}
      - HADOOP_OPTS=--add-opens=java.base/java.lang=ALL-UNNAMED
    depends_on:
      - spark-master
    deploy:
      mode: replicated
      replicas: 4

  client:
    image: ghcr.io/ca4022/csc1109-lab5-client
    environment:
      - SHELL=${SHELL}
      - EDITOR=${EDITOR}
      - HADOOP_HOME=${HADOOP_HOME}
      - HADOOP_USER_NAME=${HADOOP_USER_NAME}
      - HADOOP_OPTS=--add-opens=java.base/java.lang=ALL-UNNAMED
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
      spark-master:
        condition: service_started
    command: sleep infinity
    working_dir: /lab/
    volumes:
      - .:/lab/
      - ./config/:${HADOOP_HOME}/etc/hadoop
      - jvm-shared-cache:/var/cache/javasharedresources
    stdin_open: true
    tty: true

volumes:
  jvm-shared-cache:

